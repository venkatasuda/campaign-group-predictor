# Build the Streamlit frontend image.
#
# Why this file exists: `gcloud run deploy --source .` always uses the default
# `Dockerfile` and offers no way to select another. Since this repository ships two
# images - the API and the frontend - the frontend needs an explicit build config that
# points at `Dockerfile.frontend`.
#
# Note on $PROJECT_ID: Cloud Build expands built-in substitutions inside step arguments
# and the `images` list, but NOT inside defaults declared in a `substitutions:` block.
# It is therefore referenced directly below rather than through a custom substitution.
#
# Usage:
#   gcloud builds submit --config cloudbuild.frontend.yaml .

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - --file=Dockerfile.frontend
      - --tag=europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/campaign-frontend
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/campaign-frontend

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/campaign-frontend

options:
  logging: CLOUD_LOGGING_ONLY
